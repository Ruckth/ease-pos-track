<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Ease · Ticket workspace preview</title>
<style>
:root {
  color-scheme: light dark;
  --ink: var(--foreground, light-dark(#172d28, #edf6f0));
  --quiet: var(--muted-foreground, light-dark(#4d6259, #b6cabe));
  --surface: var(--card, light-dark(#fff, #16241e));
  --wash: light-dark(#f4f7f3, #1b2b24);
  --line: var(--border, light-dark(#c9d5cd, #4c6054));
  --strong: light-dark(#145946, #a8ddbf);
  --on-strong: light-dark(#fff, #123624);
  --tint: light-dark(#e5f2e8, #263d30);
  --attention: light-dark(#925114, #f7ca89);
  --danger: light-dark(#9c3030, #ffb4ae);
  --focus: var(--ring, light-dark(#145caa, #94c6ff));
  --sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  font: 15px/1.5 var(--sans);
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; }
body, button, input, select, textarea, dialog { color: var(--ink); }
main { max-width: 1240px; margin-inline: auto; }
button, input, select, textarea, summary { font: inherit; }
button, select, input, textarea, summary { min-height: 44px; }
button, select, summary { min-inline-size: 44px; cursor: pointer; }
button, select, input, textarea {
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  font-size: .91rem; padding: 8px 12px;
}
button { font-weight: 600; }
button:hover:enabled, summary:hover { background: var(--wash); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
button.primary:hover { filter: brightness(1.12); }
.link { background: transparent; color: var(--strong); border-color: transparent; }
.negative { color: var(--danger); }
input, select, textarea { max-width: 100%; min-width: 0; }
input, textarea { width: 100%; }
input::placeholder, textarea::placeholder { color: var(--quiet); opacity: .9; }
textarea { resize: vertical; min-height: 96px; }
h1,h2,h3,p,ul,ol { margin: 0; }
h1,h2,h3 { line-height: 1.24; text-wrap: pretty; }
h1 { font-size: clamp(1.55rem, 3.5vw, 2.25rem); letter-spacing: -.045em; }
h2 { font-size: 1.2rem; letter-spacing: -.025em; }
h3 { font-size: 1rem; }
p, button, h1, h2, h3, label, li, dd, dt { overflow-wrap: anywhere; }
[hidden] { display: none !important; }
.muted, small { color: var(--quiet); }
small { font-size: .81rem; }
.mono { font: .8rem/1.5 var(--mono); letter-spacing: .025em; }
.wrap, .actions, .ticket-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; top: 2px; left: 2px; z-index: 9; transform: translateY(-140%); background: var(--surface); color: var(--ink); padding: 12px; }
.skip:focus { transform: none; }
.topline { border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; letter-spacing: -.04em; font-weight: 720; white-space: nowrap; }
.logo { display: grid; place-items: center; background: var(--strong); color: var(--on-strong); border-radius: 8px; width: 30px; height: 30px; font: 700 1.08rem var(--mono); }
nav { display: flex; gap: 2px; }
nav button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; font-size: .86rem; }
nav button[aria-pressed="true"] { border-bottom-color: var(--strong); color: var(--strong); }
.workspace { padding-block: 18px; }
.heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.context { display: flex; gap: 8px; align-items: center; color: var(--quiet); font-size: .84rem; margin-bottom: 3px; }
.context .mark { color: var(--strong); font-weight: 700; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.toolbar label { flex: 0 1 auto; min-width: 0; }
.toolbar .search { flex: 1 1 180px; }
.toolbar label span { display: block; color: var(--quiet); font-size: .76rem; margin-bottom: 3px; }
.toolbar input, .toolbar select { width: 100%; }
#filter { max-width: 200px; }
#view { max-width: 120px; }
.menu { position: relative; }
.menu summary { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: .85rem; font-weight: 600; list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-panel { position: absolute; z-index: 4; inset-inline-end: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: max-content; max-width: min(260px, 90vw); padding: 4px; box-shadow: 0 4px 16px #1020191a; }
.menu-panel button { display: block; width: 100%; text-align: start; border: 0; }
.work-area, .work-area > * { min-width: 0; }
.list, .detail, .form, .plan-panel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.list-head, .detail-nav { min-height: 44px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--quiet); font-size: .78rem; }
.list-head p { font-weight: 650; }
.ticket { display: grid; align-items: center; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ticket:last-child { border-bottom: 0; }
.ticket.selected { background: var(--tint); box-shadow: inset 3px 0 var(--strong); }
.ticket-open { display: grid; gap: 3px; padding: 4px 0; width: 100%; text-align: start; background: transparent; border: 0; font-weight: 500; }
.ticket-open:hover:enabled { background: transparent; }
.ticket-open:hover .ticket-title { text-decoration: underline; text-underline-offset: 3px; }
.ticket-title { font-size: 1rem; line-height: 1.35; font-weight: 650; }
.ticket-meta { gap: 5px 10px; color: var(--quiet); font-size: .79rem; }
.urgency { color: var(--attention); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; }
.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--strong); }
.status.waiting::before { background: var(--attention); }
.status.done::before { background: var(--quiet); }
.ticket .quick, .detail-nav button { font-size: .83rem; }
.empty { padding: 24px 16px; display: grid; gap: 10px; justify-items: start; }
.empty p { color: var(--quiet); }
.detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; padding-block: 4px; }
.detail-nav .actions { gap: 2px; }
.detail-body, .form, .plan-panel { padding: clamp(14px, 3vw, 22px); }
.detail-body > h1 { margin-block: 6px 12px; font-size: clamp(1.4rem, 3.1vw, 1.85rem); }
.description { white-space: pre-wrap; line-height: 1.65; }
.detail-actions { margin-block: 16px; }
.disclosure { border-top: 1px solid var(--line); }
.disclosure > summary { padding: 11px 0; font-size: .92rem; font-weight: 620; }
.inside { padding-bottom: 16px; }
.inside > * + *, .form > * + *, .plan-panel > * + * { margin-block-start: 12px; }
.board { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit,minmax(min(100%,260px),1fr)); align-items: start; }
.lane { background: var(--wash); border: 1px solid var(--line); padding: 10px; border-radius: 10px; }
.lane h2 { font-size: .95rem; padding: 4px 4px 10px; }
.lane .ticket { background: var(--surface); border-radius: 6px; padding: 9px; grid-template-columns: 1fr; }
.lane .quick { justify-self: start; }
.lane .ticket + .ticket { margin-top: 6px; }
.form-page { max-width: 660px; margin: 18px auto; }
.field { display: grid; gap: 5px; }
.field > label, .field > span { font-weight: 600; font-size: .9rem; }
.field small { font-weight: 400; }
.form-actions { padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }
.history, .messages { list-style: none; padding: 0; }
.history li, .messages li { padding: 6px 0; }
.sample { position: relative; width: 100%; min-height: 138px; border-radius: 8px; border: 1px solid var(--line); background: var(--wash); display: grid; place-items: center; padding: 20px; }
.paper { background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; width: min(210px, 100%); font: .8rem/1.55 var(--mono); }
.point { position: absolute; transform: translate(-50%,-50%); border-radius: 50%; display: grid; place-items: center; background: var(--strong); color: var(--on-strong); width: 26px; height: 26px; font-size: .75rem; }
.pin-editor { padding: 12px; border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 10px; }
.pin-editor input[type="range"] { width: 100%; }
.notice { position: sticky; bottom: 8px; z-index: 5; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; background: var(--ink); color: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: .87rem; }
.notice span { flex: 1 1 130px; }
.notice button { background: transparent; color: inherit; border-color: currentColor; }
.notice button:hover:enabled { background: transparent; text-decoration: underline; }
dialog { max-width: min(430px,calc(100% - 30px)); padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
dialog::backdrop { background: #15281f80; }
dialog p { margin-block: 10px 16px; }
.plan-panel + .plan-panel { margin-top: 12px; }
.plan-panel dt { font-weight: 650; }
.plan-panel dd { margin: 0 0 12px; color: var(--quiet); }
.foot { color: var(--quiet); font-size: .78rem; padding: 10px 0; }
@media(min-width:850px) {
  .work-area.queue.split { display: grid; grid-template-columns: minmax(300px,.85fr) minmax(360px,1.15fr); gap: 14px; align-items: start; }
  .split .ticket { grid-template-columns: minmax(0,1fr); }
  .split .quick { justify-self: start; }
}
@media(max-width:849px) {
  .work-area.split .list, .workspace:has(.work-area.split) > .heading, .workspace:has(.work-area.split) > .toolbar { display: none; }
}
@media(max-width:500px) {
  .wordmark { font-size: .9rem; gap: 5px; }
  .logo { display: none; }
  nav { gap: 0; }
  nav button { padding-inline: 8px; }
  .workspace { padding-top: 12px; }
  .toolbar .search { flex-basis: 100%; }
  .toolbar label:has(#filter) { flex: 1; }
  .toolbar #filter { max-width: none; }
  .ticket { padding: 9px 10px; gap: 5px 7px; }
  .quick { padding-inline: 8px; }
  .ticket:has([data-media]) { grid-template-columns: 1fr; }
  .detail-nav { padding-inline: 6px; }
  input, textarea, select { font-size: 16px; }
}
@media(max-width:350px) {
  .wordmark { font-size: .86rem; }
  nav button { font-size: .8rem; padding-inline: 6px; }
  .ticket { grid-template-columns: 1fr; }
  .ticket .quick { justify-self: start; }
  .toolbar { gap: 4px; }
  .toolbar select, .menu summary { padding-inline: 6px; }
}
@media(forced-colors:active) { :focus-visible { outline: 3px solid Highlight; } }
.point.selected-point { outline: 4px double var(--focus); outline-offset: 3px; }
.pin-list { list-style: none; padding-inline-start: 0; }
.pin-list button { text-align: start; margin-block: 2px; }
.pin-list button[aria-pressed="true"] { border-color: var(--strong); background: var(--tint); }
.journey-compare { margin: 0; }
.journey-compare figcaption { color: var(--quiet); font-size: .85rem; }
.journey { margin-block: 16px; }
.journey > strong { display: block; margin-bottom: 3px; }
.click-count { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 1.4rem; gap: 6px; align-items: center; font-size: .84rem; }
.click-track { display: block; overflow: hidden; height: 8px; background: var(--wash); border-radius: 4px; }
.click-track i { display: block; height: 100%; background: var(--quiet); }
.click-count.proposed i { background: var(--strong); }
</style>
</head>
<body>
<main>
  <a class="skip" href="#content">Skip to workspace</a>
  <header class="topline">
    <span class="wordmark"><span class="logo" aria-hidden="true">t</span>Track Ease</span>
    <nav aria-label="Preview workspaces">
      <button data-page="staff">Staff</button>
      <button data-page="customer">Customer</button>
      <button data-page="plan">UX plan</button>
    </nav>
  </header>
  <div id="content" tabindex="-1"></div>
  <div id="result-announcement" class="sr" role="status" aria-live="polite"></div>
  <div id="notice" class="notice" hidden>
    <span id="notice-text" role="status" aria-live="polite"></span>
    <button id="undo" hidden>Undo</button>
    <button id="dismiss" aria-label="Dismiss notification">Dismiss</button>
  </div>
  <p class="foot">Interactive preview · Fictional data resets on reload.</p>
</main>
<template id="audit-evidence">
  <section class="plan-panel">
    <h2>Task checks</h2>
    <p>The independent reviewer scored all eight prototype categories 9/10. Thirteen browser scenarios cover navigation, clicks, layout, roles and recovery. Usability testing with staff and customers is the next validation step.</p>
    <figure class="journey-compare">
      <figcaption>App paths from source inspection. Preview activations counted in Chromium. Typing and field focus are excluded.</figcaption>
      <div class="journey"><strong>Send a customer Ticket</strong>
        <div class="click-count"><span>Guided</span><span class="click-track" aria-hidden="true"><i style="width:80%"></i></span><b>4</b></div>
        <div class="click-count proposed"><span>Preview</span><span class="click-track" aria-hidden="true"><i style="width:40%"></i></span><b>2</b></div>
        <small>The current Review shortcut takes three activations.</small>
      </div>
      <div class="journey"><strong>Read three Tickets in sequence</strong>
        <div class="click-count"><span>App</span><span class="click-track" aria-hidden="true"><i style="width:100%"></i></span><b>5</b></div>
        <div class="click-count proposed"><span>Preview</span><span class="click-track" aria-hidden="true"><i style="width:60%"></i></span><b>3</b></div>
      </div>
      <div class="journey"><strong>Acknowledge a new Ticket</strong>
        <div class="click-count"><span>App</span><span class="click-track" aria-hidden="true"><i style="width:20%"></i></span><b>1</b></div>
        <div class="click-count proposed"><span>Preview</span><span class="click-track" aria-hidden="true"><i style="width:20%"></i></span><b>1</b></div>
      </div>
    </figure>
  </section>
</template>
<dialog id="confirmation" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-description"></p>
  <div class="actions">
    <button id="keep" autofocus>Cancel</button>
    <button id="confirm" class="negative">Confirm</button>
  </div>
</dialog>
<script>
"use strict";

const project = "POS";
const statuses = {
  new: "New", acknowledged: "Acknowledged", in_progress: "In progress",
  waiting: "Waiting for information", done: "Resolved"
};
const nextActions = {
  new: ["Acknowledge", "acknowledged"], acknowledged: ["Start work", "in_progress"],
  in_progress: ["Resolve", "done"], waiting: ["Resume work", "in_progress"], done: ["Reopen", "in_progress"]
};
const sampleTickets = [
  ["POS-0042", "Receipt total differs from the checkout total", "The checkout screen shows ฿1,250 after the discount. The printed receipt shows ฿1,150.", "new", 82, true],
  ["POS-0041", "Scanner stops after the first item", "The first barcode scans. The scanner must be reconnected before it reads the next item.", "in_progress", 65, false],
  ["POS-0039", "Printer disconnects during checkout", "The receipt printer disconnects twice a day. Restarting the app reconnects it.", "waiting", 44, true],
  ["POS-0038", "Add the branch name to receipts", "Please show the branch under the shop name on printed receipts.", "acknowledged", null, false],
  ["POS-0036", "Thai product names missing from search results", "The search now finds products by their Thai names.", "done", 30, true],
  ["POS-0030", "Update the printed shop address", "The new address appears on receipts.", "done", null, true]
];
const samplePin = { x: 72, y: 65, text: "Printed total differs here." };
const $ = selector => document.querySelector(selector);
const escapeText = value => String(value ?? "").replace(/[&<>"']/g, char =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
function seedTickets() {
  return sampleTickets.map(([id, title, description, status, urgency, customer]) => ({
    id, title, description, status, urgency, customer, project, version: 0,
    archived: id === "POS-0030", attachment: id === "POS-0042", pins: id === "POS-0042" ? [{ ...samplePin }] : [],
    events: [{ text: "Ticket created", staffOnly: false }],
    messages: id === "POS-0039" ? [{ author: "Staff", text: "Which printer model and connection are you using?" }] : []
  }));
}
let tickets = seedTickets();
let nextNumber = 43;
let role = "staff";
let page = "workspace";
let pendingUndo = null;
let confirming = null;
let members = ["customer@example.com"];
const projectRoles = new Map();
function freshSession() {
  return {
    selected: null, view: "queue", filter: "active", query: "", sequence: [], returnTo: null,
    order: [], draft: null, edits: new Map(), urgency: new Map(), messages: new Map(),
    sections: new Map(), pinDrafts: new Map(), activePins: new Map(), editing: null
  };
}
function session() {
  const key = role + "/" + project;
  if (!projectRoles.has(key)) projectRoles.set(key, freshSession());
  return projectRoles.get(key);
}
function draft() {
  return session().draft ??= { title: "", description: "", attachment: false, pins: [], preview: false };
}
function allowed(ticket) {
  return ticket?.project === project && (role === "staff" || ticket.customer && !ticket.archived);
}
function findTicket(id) {
  return tickets.find(ticket => ticket.id === id && allowed(ticket));
}
function matching(ticket) {
  const { filter, query } = session();
  if (!allowed(ticket) || ticket.archived !== (filter === "archive")) return false;
  if (filter === "active" && ticket.status === "done") return false;
  if (Object.hasOwn(statuses, filter) && filter !== ticket.status) return false;
  return [ticket.id, ticket.title, ticket.description].join(" ").toLocaleLowerCase().includes(query.trim().toLocaleLowerCase());
}
function suggestedOrder() {
  const all = tickets.filter(allowed);
  return all.sort((a, b) => {
    if (role === "customer") return Number(b.status === "waiting") - Number(a.status === "waiting") || b.id.localeCompare(a.id);
    return (b.urgency ?? -1) - (a.urgency ?? -1) || b.id.localeCompare(a.id);
  }).map(ticket => ticket.id);
}
function visibleTickets() {
  const context = session();
  if (!context.order.length) context.order = suggestedOrder();
  const known = new Set(context.order);
  context.order.push(...suggestedOrder().filter(id => !known.has(id)));
  const visible = context.order.map(findTicket).filter(ticket => ticket && matching(ticket));
  return role === "customer" ? visible.sort((a, b) => Number(b.status === "waiting") - Number(a.status === "waiting")) : visible;
}
function button(attrs, text, style = "") {
  return '<button type="button" class="' + style + '" ' + attrs + '>' + text + '</button>';
}
function section(key, title, body, ticketId) {
  const open = session().sections.get(ticketId)?.has(key) ? " open" : "";
  return '<details class="disclosure" data-section="' + key + '" data-owner="' + ticketId + '"' + open + '><summary>' +
    title + '</summary><div class="inside">' + body + '</div></details>';
}
function rememberSection(id, key, open) {
  const sections = session().sections;
  if (!sections.has(id)) sections.set(id, new Set());
  if (open) sections.get(id).add(key);
  else sections.get(id).delete(key);
}
function focusTarget(selector) {
  const target = [...document.querySelectorAll(selector || "#heading")].find(el => el.getClientRects().length && !el.disabled);
  (target || $("#heading") || $("#content")).focus();
}
function selectTicket(ticket, origin) {
  if (!allowed(ticket)) return;
  const context = session();
  context.returnTo = origin || '[data-open="' + ticket.id + '"]';
  context.selected = ticket.id;
  context.sequence = visibleTickets().map(item => item.id);
  context.editing = null;
  render("#detail-heading");
}
function leaveDetail() {
  const context = session();
  context.selected = null;
  context.editing = null;
  if (context.view === "focus") context.view = "queue";
  render(context.returnTo || "#search");
}
function hideNotice() {
  pendingUndo = null;
  $("#notice").hidden = true;
  $("#notice-text").textContent = "";
}
function notice(message, undo = null) {
  pendingUndo = undo;
  $("#notice").hidden = false;
  $("#undo").hidden = !undo;
  $("#notice-text").textContent = message;
}
function mutate(ticket, change, eventText, options = {}) {
  if (!allowed(ticket) || ticket.archived && !options.restore) return;
  const before = structuredClone(ticket);
  change(ticket);
  ticket.version++;
  ticket.events.unshift({ text: eventText, staffOnly: Boolean(options.staffOnly) });
  const revision = ticket.version;
  const actor = role;
  const undo = () => {
    const current = findTicket(ticket.id);
    if (actor !== role || !current || current.version !== revision) return;
    Object.assign(current, before, { version: revision + 1 });
    notice("Change undone.");
    render(options.focus || "#detail-heading");
  };
  notice(ticket.id + " · " + eventText, undo);
  render(options.focus || "#detail-heading");
}
function setStatus(ticket, status, focus) {
  if (role !== "staff" || !Object.hasOwn(statuses, status) || !ticket || status === ticket.status) return;
  mutate(ticket, item => { item.status = status; }, "Status changed to " + statuses[status], { focus });
}
function closeMenu() {
  const menu = $("#workspace-menu");
  if (menu?.open) menu.open = false;
}
function switchPage(nextPage) {
  hideNotice();
  closeMenu();
  page = nextPage;
  render(page === "create" ? "#new-title" : "#heading");
}
function switchRole(nextRole) {
  hideNotice();
  role = nextRole;
  page = "workspace";
  render(session().selected ? "#detail-heading" : "#heading");
}
function statusText(ticket) {
  return '<span class="status ' + ticket.status + '">' + statuses[ticket.status] + '</span>';
}
function plural(count, label) { return count + " " + label + (count === 1 ? "" : "s"); }
function row(ticket, lane = false) {
  const selected = session().selected === ticket.id;
  const priority = role === "staff" && ticket.urgency >= 76 ? '<span class="urgency">Urgency ' + ticket.urgency + '</span>' : "";
  const meta = [!lane && statusText(ticket), priority].filter(Boolean).join("");
  const action = nextActions[ticket.status];
  const quick = ticket.archived ? button('data-restore="' + ticket.id + '"', "Restore", "quick") :
    role === "staff" ? button('data-move="' + ticket.id + '" aria-label="' + action[0] + " " + ticket.id + '"', action[0], "quick") : "";
  const attachment = ticket.attachment ? button('data-media="' + ticket.id + '" aria-label="Open attachment for ' + ticket.id + '"', "Attachment", "quick link") : "";

function urlState() {
  const url = new URL(location.href);
  const context = session();
  url.search = "";

  url.searchParams.set("role", role);
  if (page !== "workspace") url.searchParams.set("page", page);
  if (context.view !== "queue" && role === "staff") url.searchParams.set("variant", context.view);
  if (context.query) url.searchParams.set("q", context.query);
  if (context.filter !== "active") url.searchParams.set("filter", context.filter);
  if (context.selected && page === "workspace") url.searchParams.set("ticket", context.selected);
  return url;
}
function syncUrl(mode = "pushState") {
  try {
    const url = urlState();
    if (url.href !== location.href) history[mode](null, "", url);
  } catch { /* Embedded viewers may restrict history access. */ }
}
function readUrl(event) {
  const query = new URLSearchParams(location.search);
  const oldRole = role;
  role = query.get("role") === "customer" ? "customer" : "staff";
  const context = session();
  const oldSelected = context.selected;
  const requestedPage = query.get("page") || "workspace";
  const allowedPages = ["workspace", "create", "account", "auth", "plan", "unavailable"];
  if (role === "staff") allowedPages.push("settings");
  if (role === "customer") allowedPages.push("register");
  page = allowedPages.includes(requestedPage) ? requestedPage : "workspace";
  const requestedProject = query.get("project");
  const requestedView = query.get("variant");
  context.view = role === "staff" && ["board","focus"].includes(requestedView) ? requestedView : "queue";
  const filter = query.get("filter");
  const options = ["all","active",...Object.keys(statuses)];
  if (role === "staff") options.push("archive");
  context.filter = options.includes(filter) ? filter : "active";
  context.query = query.get("q") || "";
  const id = query.get("ticket");
  context.selected = null;
  if (requestedProject && requestedProject !== project || id && !findTicket(id)) page = "unavailable";
  if (page === "workspace" && id) {
    context.selected = id;
    if (findTicket(id).archived) context.filter = "archive";
  } else if (page === "workspace" && context.view === "focus") {
    context.selected = visibleTickets()[0]?.id ?? null;
  }
  context.sequence = visibleTickets().map(item => item.id);
  context.editing = null;
  hideNotice();
  const focus = context.selected ? "#detail-heading" : page === "workspace" && oldRole === role && oldSelected ? '[data-open="' + oldSelected + '"]' : "#heading";
  render(event ? focus : undefined);
}

  }, "[data-delete]");
}
function refreshOrder() {
  session().order = suggestedOrder();
  session().sequence = visibleTickets().map(item => item.id);
  render("#search");
  notice("Ticket order refreshed.");
}
function enterView(view) {
  const context = session();
  context.view = view;
  if (view === "focus" && !context.selected) {
    const first = visibleTickets()[0];
    if (first) return selectTicket(first, "#view");
  }
  render("#view");
}
function openWorkspace() {
  page = "workspace";
  if (!findTicket(session().selected)) session().selected = null;
  render(session().selected ? "#detail-heading" : "#heading");
}
document.addEventListener("click", async event => {
  const target = event.target.closest("button");
  if (!target || target.disabled || target.closest("dialog")) return;
  const data = target.dataset;
  const context = session();
  const ticket = findTicket(context.selected);
  if ("page" in data) {
    if (data.page === "plan") switchPage("plan");
    else if (role !== data.page) switchRole(data.page);
    else { hideNotice(); context.selected = null; context.editing = null; if (context.view === "focus") context.view = "queue"; openWorkspace(); }
  } else if (target.id === "undo") {
    const apply = pendingUndo;
    pendingUndo = null;
    apply?.();
  } else if (target.id === "dismiss") {
    hideNotice(); focusTarget(context.selected ? "#detail-heading" : "#heading");
  } else if ("open" in data) {
    selectTicket(findTicket(data.open));
  } else if ("media" in data) {
    const item = findTicket(data.media);
    if (item?.attachment) {
      rememberSection(item.id, "media", true);
      selectTicket(item, '[data-media="' + item.id + '"]');
      focusTarget('[data-section="media"] summary');
    }
  } else if ("neighbor" in data) {
    const next = findTicket(data.neighbor);
    if (next) { context.selected = next.id; context.editing = null; context.returnTo = '[data-open="' + next.id + '"]'; render("#detail-heading"); }
  } else if ("back" in data) {
    leaveDetail();
  } else if ("new" in data) {
    switchPage("create");
  } else if ("move" in data) {
    const item = findTicket(data.move);
    if (item) {
      const actionFocus = context.selected === item.id ? "#detail-heading" : '[data-move="' + item.id + '"]';
      setStatus(item, nextActions[item.status][1], actionFocus);
    }
  } else if ("clear" in data) {
    context.filter = "all"; context.query = ""; context.selected = null; render("#search");
  } else if ("refresh" in data) {
    refreshOrder();
  } else if ("settings" in data && role === "staff") {
    switchPage("settings");
  } else if ("account" in data) {
    switchPage("account");
  } else if ("workspace" in data) {
    hideNotice(); openWorkspace();
  } else if ("closeComposer" in data) {
    page = "workspace"; openWorkspace(); focusTarget(context.selected ? "#detail-heading" : "[data-new]");
  } else if ("sample" in data) {
    draft().attachment = true; render('[data-add-pin="draft"]');
  } else if ("removeSample" in data) {
    removeAttachment();
  } else if ("preview" in data) {
    draft().preview = !draft().preview; render("[data-preview]");
  } else if ("savedPin" in data) {
    const index = Number(data.savedPin);
    session().activePins.set(data.owner, index);
    render('[data-saved-pin="' + index + '"]');
  } else if ("addPin" in data) {
    addPin(data.addPin);
  } else if ("cancelPin" in data) {
    context.pinDrafts.delete(data.cancelPin); render('[data-add-pin="' + data.cancelPin + '"]');
  } else if ("savePin" in data) {
    savePin(data.savePin);
  } else if ("edit" in data && ticket && !ticket.archived) {
    if (!context.edits.has(ticket.id)) context.edits.set(ticket.id, { title: ticket.title, description: ticket.description, version: ticket.version });
    context.editing = ticket.id; render("#edit-title");
  } else if ("cancelEdit" in data && ticket) {
    context.edits.delete(ticket.id); context.editing = null; render("[data-edit]");
  } else if ("cancelUrgency" in data && ticket) {
    context.urgency.delete(ticket.id); render("#urgency");
  } else if ("copy" in data && ticket) {
    try { await navigator.clipboard.writeText(ticket.id); notice(ticket.id + " copied."); }
    catch { notice("Select the Ticket number to copy it: " + ticket.id); }
  } else if ("archive" in data && ticket && role === "staff") {
    mutate(ticket, item => { item.archived = true; }, "Archived");
  } else if ("restore" in data && role === "staff") {
    const item = findTicket(data.restore);
    if (item?.archived) mutate(item, item => { item.archived = false; }, "Restored", { restore: true });
  } else if ("delete" in data && role === "customer" && ticket) {
    deleteTicket(ticket);
  } else if ("signout" in data) {
    signOut();
  } else if ("entryRole" in data) {
    role = role === "staff" ? "customer" : "staff"; switchPage("auth");
  } else if ("register" in data && role === "customer") {
    switchPage(page === "register" ? "auth" : "register");
  } else if ("reveal" in data) {
    const reveal = $("#password").type === "password";
    $("#password").type = reveal ? "text" : "password";
    if ($("#password-confirm")) $("#password-confirm").type = reveal ? "text" : "password";
    target.textContent = reveal ? translated("Hide password", "ซ่อนรหัสผ่าน") : translated("Show password", "แสดงรหัสผ่าน");
  } else if ("testRetry" in data) {
    failNextSubmit = true; notice("The next submit will simulate a connection failure.");
  } else if ("reset" in data) {
    askConfirm("Reset the preview?", "This clears sample edits, drafts and new Tickets in both workspaces.", "Reset preview", reset, "[data-reset]");
  } else return;
  syncUrl();
});
document.addEventListener("click", event => {
  const surface = event.target.closest("[data-pin-surface]");
  if (surface) {
    const pin = session().pinDrafts.get(currentPinKey());
    if (pin) {
      const box = surface.getBoundingClientRect();
      pin.x = Math.min(95, Math.max(5, Math.round(100 * (event.clientX - box.left) / box.width)));
      pin.y = Math.min(95, Math.max(5, Math.round(100 * (event.clientY - box.top) / box.height)));
      render("#pin-note");
    }
  }
  if (!event.target.closest("#workspace-menu")) closeMenu();
});
$("#content").addEventListener("toggle", event => {
  const { section: key, owner } = event.target.dataset;
  if (key && owner && event.target.isConnected) rememberSection(owner, key, event.target.open);
}, true);
$("#content").addEventListener("input", event => {
  const el = event.target;
  const context = session();
  const id = context.selected;
  switch (el.id) {
    case "search": {
      const position = el.selectionStart;
      context.query = el.value; context.selected = null;
      render("#search"); $("#search").setSelectionRange(position, position); announceResults(); syncUrl("replaceState"); break;
    }
    case "new-title": draft().title = el.value; break;
    case "new-description": draft().description = el.value; break;
    case "edit-title": context.edits.get(id).title = el.value; break;
    case "edit-description": context.edits.get(id).description = el.value; break;
    case "urgency":
      context.urgency.set(id, el.value);
      $("[data-cancel-urgency]").hidden = el.value === String(findTicket(id).urgency ?? "");
      break;
    case "message-text": context.messages.set(id, el.value); break;
    case "pin-note": context.pinDrafts.get(currentPinKey()).text = el.value; break;
    case "pin-x":
    case "pin-y": {
      const axis = el.id.slice(-1);
      const pin = context.pinDrafts.get(currentPinKey());
      pin[axis] = Number(el.value);
      $("#" + el.id + "-value").textContent = el.value + "%";
      const marker = $(".sample .point:last-child");
      marker.style[axis === "x" ? "left" : "top"] = el.value + "%";
      break;
    }
  }
});
$("#content").addEventListener("change", event => {
  const el = event.target;
  if (el.id === "account-language") {
    const fields = [...document.querySelectorAll("#auth-form input")].map(input => [input.id, input.value]);
    accountLanguage = el.value === "th" ? "th" : "en";
    render("#account-language");
    for (const [id, value] of fields) document.getElementById(id).value = value;
    return;
  }
  if (el.id === "filter") {
    session().filter = el.value;
    session().selected = null;
    if (session().view === "focus") enterView("focus");
    else render("#filter");
    announceResults();
  } else if (el.id === "view") {
    enterView(el.value);
  } else return;
  syncUrl();
});
function submitTicket() {
  const context = session();
  const item = draft();
  if (!item.title.trim()) return invalid("#new-title", "Enter a title.");
  if (context.pinDrafts.has("draft")) {
    focusTarget("#pin-note");
    notice("Save or cancel your pin before submitting.");
    return;
  }
  if (failNextSubmit) {
    failNextSubmit = false;
    context.draftError = "Connection interrupted. Your draft and attachment are ready to submit again.";
    render('#create-form button[type="submit"]');
    return;
  }
  const ticket = {
    id: project + "-" + String(nextNumber++).padStart(4, "0"), project, title: item.title.trim(), description: item.description.trim(),
    urgency: null, status: "new", archived: false, customer: role === "customer", attachment: item.attachment,
    pins: structuredClone(item.pins), version: 0, events: [{ text: "Ticket created", staffOnly: false }], messages: []
  };
  tickets.unshift(ticket);
  context.order.unshift(ticket.id);
  context.activePins.delete("draft");
  context.draft = null; context.draftError = null; context.filter = "active"; context.query = "";
  page = "workspace";
  selectTicket(ticket);
  notice(ticket.id + " created.");
}
function saveMessage(ticket) {
  if (!ticket || ticket.archived || !ticket.customer) return;
  const text = $("#message-text").value.trim();
  if (!text) return invalid("#message-text", "Enter a message.");
  if (role === "customer" && (ticket.status !== "waiting" || !ticket.messages.some(message => message.author === "Staff"))) return;
  const author = role === "staff" ? "Staff" : "Customer";
  session().messages.delete(ticket.id);
  mutate(ticket, item => {
    item.messages.push({ author, text });
    if (role === "staff") item.status = "waiting";
  }, author === "Staff" ? "Information requested" : "Customer replied", { focus: '[data-section="conversation"] summary' });
}
$("#content").addEventListener("submit", event => {
  event.preventDefault();
  const context = session();
  const ticket = findTicket(context.selected);
  switch (event.target.id) {
    case "create-form": submitTicket(); break;
    case "edit-form": {
      const edit = context.edits.get(ticket.id);
      if (!edit.title.trim()) return invalid("#edit-title", "Enter a title.");
      if ((edit.reviewedVersion ?? edit.version) !== ticket.version) {
        edit.reviewedVersion = ticket.version;
        render("#edit-conflict");
        return;
      }
      context.edits.delete(ticket.id); context.editing = null;
      mutate(ticket, item => { item.title = edit.title.trim(); item.description = edit.description.trim(); }, "Details updated", { focus: "[data-edit]" });
      break;
    }
    case "urgency-form": {
      if (role !== "staff") return;
      const value = $("#urgency").value.trim();
      if (value && (!/^\d+$/.test(value) || Number(value) < 1 || Number(value) > 100)) return invalid("#urgency", "Use a whole number from 1 to 100, or leave blank.");
      context.urgency.delete(ticket.id);
      mutate(ticket, item => { item.urgency = value ? Number(value) : null; }, value ? "Urgency set to " + value : "Urgency cleared", { staffOnly: true, focus: "#urgency" });
      break;
    }
    case "status-form": setStatus(ticket, $("#status-select").value, "#status-select"); break;
    case "message-form": saveMessage(ticket); break;
    case "member-form": {
      if (role !== "staff") return;
      const email = $("#member-email").value.trim().toLowerCase();
      if (members.includes(email)) return invalid("#member-email", "This member already has access.");
      members.push(email); render("#member-email"); notice("Sample member added."); break;
    }
    case "auth-form":
      if (page === "register" && $("#password").value !== $("#password-confirm").value) return invalid("#password-confirm", translated("Use the same password in both fields.", "กรุณากรอกรหัสผ่านทั้งสองช่องให้ตรงกัน"));
      session().selected = null; switchPage("workspace"); break;
  }
  syncUrl();
});
document.addEventListener("keydown", event => {
  if (event.key !== "Escape" || $("#confirmation").open) return;
  if ($("#workspace-menu")?.open) { closeMenu(); focusTarget("#workspace-menu summary"); }
  else if (page === "create") { openWorkspace(); focusTarget(session().selected ? "#detail-heading" : "[data-new]"); }
  else if (page === "workspace" && session().editing) {
    session().editing = null; render("[data-edit]");
  } else if (page === "workspace" && session().selected) leaveDetail();
  else if (["settings", "account", "plan"].includes(page)) openWorkspace();
  else return;
  syncUrl();
});
window.addEventListener("popstate", readUrl);
readUrl();
</script>
</body>
</html>
