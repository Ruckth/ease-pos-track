name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Types, unit and Convex tests, and the production bundle, in parallel.
      - run: pnpm check
      # tsgo is a TypeScript 7 preview; keep the stable checker as a guard.
      - run: pnpm run typecheck:tsc
      # Schema and functions must push to a fresh local backend.
      - run: pnpm convex:local
      # Generated bindings must be committed alongside the change that needs them.
      - run: git diff --exit-code -- convex/_generated
