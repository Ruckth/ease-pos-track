# Ticket browser workflows on a fresh Ubuntu runner. Advisory: this check is
# not required by branch rules yet (see docs/browser-verification.md for the
# promotion gate). It uses no repository secrets, only synthetic fixtures on a
# disposable loopback backend, with media cleanup disabled and provider
# traffic blocked. On failure it uploads allowlisted, sanitized evidence only;
# Playwright traces stay on the runner and are never uploaded.
name: browser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-shard:
    name: Browser tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [composer, workspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/test-results/browser
      BROWSER_TRACE: "off"
      MEDIA_CLEANUP_ENABLED: "false"
      UPLOADTHING_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the locked Playwright version
        run: pnpm exec playwright install --with-deps chromium
      # Each shard seeds its own disposable Convex backend.
      - name: Browser workflows
        run: pnpm test:browser --suite "$BROWSER_SUITE"
        env:
          BROWSER_SUITE: ${{ matrix.suite }}
      # Stability only (no baseline in CI yet): three captures must match.
      - name: Visual pilot stability (advisory)
        if: ${{ !cancelled() && matrix.suite == 'workspace' }}
        continue-on-error: true
        run: pnpm test:visual --repeat 3 --out test-results/visual
      - name: Summarize evidence
        if: failure()
        run: pnpm browser:evidence summary
      # Uploads nothing unless every public file is allowlisted and sanitized.
      - name: Verify evidence is safe to publish
        id: verify
        if: failure()
        run: pnpm browser:evidence verify
      - name: Upload sanitized evidence
        if: failure() && steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
          path: test-results/browser/public/
          retention-days: 7
          if-no-files-found: ignore
      # Synthetic Explorer harness renders, for manual review of Linux repeatability.
      - name: Upload visual pilot captures
        if: ${{ !cancelled() && matrix.suite == 'workspace' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/visual/
          retention-days: 7
          if-no-files-found: ignore

  browser-workflows:
    runs-on: ubuntu-24.04
    needs: browser-shard
    if: ${{ always() }}
    timeout-minutes: 2
    steps:
      - name: Check the browser shard result
        run: |
          printf 'Browser shard result: %s\n' "$BROWSER_RESULT"
          test "$BROWSER_RESULT" = success
        env:
          BROWSER_RESULT: ${{ needs.browser-shard.result }}
